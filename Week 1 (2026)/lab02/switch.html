 <body>
 <h1>Switch Statement</h2>
 <p>Look in the console for output</p>
 <script>
 let light = "red";
switch (light) {
  case 'red':
    console.log(`STOP!`);
    break;
  case 'yellow':
    console.log(`SLOW DOWN!`);
    break;
  case 'green':
	console.log(`GO GO GO!!!`);
	break;
  default:
    alert(`SYBAU`);
	break;
}

 </script>
 </body>
 </html>
