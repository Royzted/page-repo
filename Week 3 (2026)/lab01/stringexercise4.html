<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>String Exercise 4</title>
	<style>
	  body {
	     width:400px;
		 margin:0 auto;
	  }
	  
	  p {
	     border: solid black 1px;
		 height: 20px;
	  }
	</style>
</head>

<body>
<h1>String Exercise Four</h1>
<p id = "input"></p>
<p id = "letters"></p>
<p id = "numbers"></p>
<button>String Exercise 4</button>

<script>
const btn = document.querySelector('button');
const inp = document.getElementById('input');  
const lett = document.getElementById('letters');  
const nums = document.getElementById('numbers');  
btn.addEventListener('click', (evt) => {
	const course = prompt("Enter your couse id");
	if (!course) return;

	inp.textContent = `The Course you entered is: ${course}`;
	lett.textContent = ` ${course.substring(0,2)}`;
	nums.textContent = ` ${course.substring(2,5)}`;
});
</script>

</body>
</html>
