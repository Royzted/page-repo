<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault – Collection</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="data">

  <!-- ============================================================
       NAVIGATION
       ============================================================ -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fas fa-gamepad"></i> GameVault
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="data.html" class="active">Collection</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <!-- ============================================================
       PAGE HEADER
       ============================================================ -->
  <div class="page-header">
    <div class="container">
      <h1><i class="fas fa-database"></i> Game Collection</h1>
      <p>Browse, search, filter, and manage your favourite video games</p>
    </div>
  </div>

  <!-- ============================================================
       STATS BAR  (calculated feature: total, avg rating, newest)
       Values are set by updateDataStats() in script.js
       ============================================================ -->
  <section class="data-stats">
    <div class="container">
      <div class="stats-bar">
        <div class="stat-pill">
          <i class="fas fa-gamepad"></i>
          Total games: <span id="totalGames">0</span>
        </div>
        <div class="stat-pill">
          <i class="fas fa-star"></i>
          Avg rating: <span id="avgRating">—</span>
        </div>
        <div class="stat-pill">
          <i class="fas fa-calendar-check"></i>
          Newest: <span id="newestGame">—</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       CONTROLS BAR
       – Search input (filters by title / genre / developer)
       – Sort: select field + asc / desc buttons
       – Add Game button (toggles the form below)
       ============================================================ -->
  <section class="controls-section">
    <div class="container">
      <div class="controls-bar">

        <!-- Search -->
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by title, genre, or developer…"
            autocomplete="off"
          >
        </div>

        <!-- Sort controls -->
        <div class="sort-controls">
          <select id="sortField" title="Sort by field">
            <option value="title">Title</option>
            <option value="year">Year</option>
            <option value="rating">Rating</option>
            <option value="genre">Genre</option>
          </select>
          <button class="btn btn-icon active" id="sortAsc" title="Sort A → Z / Low → High">
            <i class="fas fa-sort-alpha-down"></i>
          </button>
          <button class="btn btn-icon" id="sortDesc" title="Sort Z → A / High → Low">
            <i class="fas fa-sort-alpha-up"></i>
          </button>
        </div>

        <!-- Add Game -->
        <button class="btn btn-primary" id="showAddForm">
          <i class="fas fa-plus"></i> Add Game
        </button>

      </div>
    </div>
  </section>

  <!-- ============================================================
       ADD GAME FORM
       Hidden by default; toggled by the "Add Game" button.
       Submission handled by addNewGame() in script.js.
       ============================================================ -->
  <section class="add-form-section" id="addFormSection" style="display:none;">
    <div class="container">
      <div class="form-card">
        <h3><i class="fas fa-plus-circle"></i> Add a New Game</h3>

        <form id="addGameForm" novalidate>
          <div class="form-grid">

            <div class="form-group">
              <label for="newTitle">Title *</label>
              <input
                type="text"
                id="newTitle"
                required
                placeholder="e.g. The Last of Us"
              >
            </div>

            <div class="form-group">
              <label for="newGenre">Genre *</label>
              <input
                type="text"
                id="newGenre"
                required
                placeholder="e.g. Action-Adventure"
              >
            </div>

            <div class="form-group">
              <label for="newDeveloper">Developer *</label>
              <input
                type="text"
                id="newDeveloper"
                required
                placeholder="e.g. Naughty Dog"
              >
            </div>

            <div class="form-group">
              <label for="newYear">Release Year *</label>
              <input
                type="number"
                id="newYear"
                required
                min="1970"
                max="2030"
                placeholder="e.g. 2023"
              >
            </div>

            <div class="form-group">
              <label for="newRating">Rating (0 – 10) *</label>
              <input
                type="number"
                id="newRating"
                required
                min="0"
                max="10"
                step="0.1"
                placeholder="e.g. 9.2"
              >
            </div>

            <div class="form-group">
              <label for="newPlatform">Platform *</label>
              <input
                type="text"
                id="newPlatform"
                required
                placeholder="e.g. PC / PS5 / Xbox"
              >
            </div>

          </div><!-- /.form-grid -->

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Save Game
            </button>
            <button type="button" class="btn btn-outline" id="cancelAdd">
              <i class="fas fa-times"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- ============================================================
       GAMES GRID
       Content is rendered here by Handlebars via renderGames()
       in script.js.  The #game-template below is the template.
       ============================================================ -->
  <section class="games-section">
    <div class="container">

      <div id="gamesGrid" class="games-grid">
        <!-- Game cards injected by script.js -->
      </div>

      <div id="noResults" class="no-results">
        <i class="fas fa-search"></i>
        <p>No games found matching your search.</p>
      </div>

    </div>
  </section>

  <!-- ============================================================
       HANDLEBARS TEMPLATE – Game Cards
       Type="text/x-handlebars-template" prevents the browser
       from executing it as JS.
       ============================================================ -->
  <script id="game-template" type="text/x-handlebars-template">
    {{#each this}}
    <div class="game-card" data-id="{{id}}">

      <div class="game-card-top">
        <span class="game-genre-tag">{{genre}}</span>
        <span class="game-rating-badge">&#9733; {{rating}}</span>
      </div>

      <!-- Game cover image. If the image property exists, show it;
           otherwise fall back to the gradient placeholder. -->
      {{#if image}}
      <div class="game-card-img game-card-img--photo">
        <img src="{{image}}" alt="{{title}} cover"
             onerror="this.parentElement.classList.remove('game-card-img--photo');
                      this.style.display='none';
                      this.parentElement.innerHTML='<i class=\'fas fa-gamepad game-icon\'></i>';">
      </div>
      {{else}}
      <div class="game-card-img"
           style="background: linear-gradient(135deg,
             hsl({{colorHue}}, 55%, 20%),
             hsl({{colorHue2}}, 75%, 12%))">
        <i class="fas fa-gamepad game-icon"></i>
      </div>
      {{/if}}

      <div class="game-card-body">
        <h3 class="game-title">{{title}}</h3>
        <p><i class="fas fa-code"></i> {{developer}}</p>
        <p><i class="fas fa-calendar-alt"></i> {{year}}</p>
        <p><i class="fas fa-desktop"></i> {{platform}}</p>
      </div>

      <div class="game-card-footer">
        <!-- data-id is used by attachDeleteListeners() to identify the game -->
        <button class="btn btn-danger btn-sm delete-btn" data-id="{{id}}">
          <i class="fas fa-trash-alt"></i> Delete
        </button>
      </div>

    </div>
    {{/each}}
  </script>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 GameVault &mdash; Built for Web Development Assignment</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
