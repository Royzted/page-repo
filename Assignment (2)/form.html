<!DOCTYPE html>
<html lang="en">    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="img/iHave0Rizz.png">
<title>Form Page</title>
<link rel="stylesheet" href="style_main.css">

<style>
/* ----- Flexbox Form Container ----- */
.form-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
}

.form-box {
    display: flex;
    flex-direction: column;
    gap: 20px;

    width: 90%;
    max-width: 600px;

    padding: 30px;
    background-color: #0F0F0F;
    border-radius: 16px;

    box-shadow: 0 0 10px rgba(255,255,255,0.1);
}

form label {
    color: white;
    font-family: "SF Pro Expanded";
    font-size: 20px;
}

form input, form select, form textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;

    background-color: #111;
    color: white;
    font-size: 18px;
    font-family: "SF Pro";
}

form input:focus, form select:focus, form textarea:focus {
    outline: 2px solid #444;
}

button.submit-btn {
    padding: 14px;
    background-color: #222;
    color: white;
    font-size: 22px;
    border-radius: 10px;
    border: 1px solid #555;
    cursor: pointer;
    font-family: "SF Pro Expanded";
    transition: background-color 0.3s ease;
}

button.submit-btn:hover {
    background-color: #444;
}
</style>

</head>
<body>

<header class="top-bar" >
    <a href="index.html"     class="button" style="font-family: SF Pro Expanded;">HOME</a>
    <a href="about.html"     class="button" style="font-family: SF Pro Expanded;">ABOUT</a>
    <a href="projects.html"     class="button" style="font-family: SF Pro Expanded;">PROJECTS</a>
    <a href="contact.html"     class="button" style="font-family: SF Pro Expanded;">CONTACT</a>
    <a href="cardOverview.html"     class="button" style="font-family: SF Pro Expanded;">CARDVIEW</a>
    <a href="projectOverview.html"     class="button" style="font-family: SF Pro Expanded;">PROJVIEW</a>

</header>

<hr>

<main>
<div class="form-wrapper">
    <div class="form-box">

        <h2 style="color:white; text-align:center; font-family:SF Pro Expanded; font-size:32px;">
            Contact Form
        </h2>

        <form>

            <!-- NAME -->
            <label for="name">Your Name *</label>
            <input type="text" id="name" name="name" required 
                   pattern="[A-Za-z\s]{2,30}" 
                   title="Only letters allowed. 2–30 characters.">

            <!-- EMAIL -->
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required
                   title="Enter a valid email format.">

            <!-- AGE -->
            <label for="age">Your Age *</label>
            <input type="number" id="age" name="age" min="1" max="120" required>

            <!-- SELECT -->
            <label for="topic">What is this about? *</label>
            <select id="topic" name="topic" required>
                <option value="">Choose...</option>
                <option value="work">Work Opportunity</option>
                <option value="project">Your Project</option>
                <option value="feedback">Website Feedback</option>
                <option value="other">Other</option>
            </select>

            <!-- RADIO -->
            <label>Preferred Contact Method *</label>
            <div style="display:flex; gap:20px; color:white; font-family:SF Pro;">
                <label><input type="radio" name="contact" value="email" required> Email</label>
                <label><input type="radio" name="contact" value="phone" required> Phone</label>
            </div>

            <!-- CHECKBOX -->
            <label>
                <input type="checkbox" required>
                I agree to the privacy policy *
            </label>

            <!-- MESSAGE -->
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="4" required 
                      placeholder="Write something..."></textarea>

            <!-- SUBMIT -->
            <button type="submit" class="submit-btn">Submit</button>

        </form>

    </div>
</div>
</main>

<footer>
  <p style="font-size:18px; font-family:SF Pro Expanded;">All rights reserved. Kiril Kononenko&copy;</p>
</footer>

</body>
</html>
