<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hover</title>
  <style>
    #myDiv {
      width: 200px;
      height: 200px;
      background-color: lightgray;
    }
  </style>
</head>

<body>
  <h1>Hover</h1>

  <div id="myDiv"></div>

  <script>
    const square = document.querySelector('#myDiv');

square.addEventListener('mouseenter', (evt) => {
    
  square.style.backgroundColor = 'green';
})

square.addEventListener('mouseleave', (evt) => {
  square.style.backgroundColor = 'lightgray';
})
  </script>
</body>
</html>
